[project]
name = "miea-mem"
version = "0.0.3"
description = "Graph-based agent memory: structure and pointers only"
readme = "README.md"
authors = [
    { name = "Kushal Panchali", email = "introvertedspacemine2@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.2",
    "mcp>=2.0.0",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=2.0"]

[project.scripts]
miea = "miea_mem.cli:main"
miea-server = "miea_mem.mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
